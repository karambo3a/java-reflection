name: Test
'on':
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test